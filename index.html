<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de compras</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  </head>
  <body>
    <header id="headerImg">
      <img src="./assets/logo.png" alt="Logo da aplicação" />
    </header>
    <main id="tittle">
      <button id="tittleBtn"><i class="ph ph-arrow-left"></i> Voltar</button>
      <h1>Compras da semana</h1>
    </main>

    <div id="listContainer">
      <input type="text" id="inputItem" placeholder="Adicione um novo item" />
      <button id="addItem">Adicionar item</button>
    </div>

    <div id="inputItems" class="input-container">
    </div>

    <div id="itemRemoved" class="hidden">
      <div class="danger-text">
        <img src="./assets/warning-circle-filled.svg" alt="">
        <span> O item foi removido da lista </span>
      </div>

      <button><img src="./assets/cancel-01-stroke-rounded.svg" alt=""></i></button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
